<!doctype html>
<meta charset="utf-8" />
<title>anon-rpc offscreen host</title>
<!--
  The DOM an MV3 extension is allowed to have.

  A service worker cannot hold the sandboxed iframe that §6 isolation is built
  from, so the harness runs here instead and the service worker remotes to it.
  This page is NOT sandboxed and NOT listed in `sandbox.pages`: it is ordinary
  extension code, and it needs `chrome.runtime` to talk to the service worker.
  The untrusted worker is one frame further in, in anon-rpc-sandbox.html.

  If your extension already uses its offscreen document for something else —
  only one is allowed per extension — do not ship this file. Call
  `mountOffscreenHost()` from your own document and construct the worker with
  `offscreenUrl: false`.
-->
<script type="module" src="anon-rpc-offscreen.js"></script>
