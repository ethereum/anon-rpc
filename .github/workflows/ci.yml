name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: impl/package-lock.json

      # Foundry: forge/anvil for the specifier subproject (contract tests and
      # the publish-script e2e against a local anvil chain).
      - uses: foundry-rs/foundry-toolchain@v1

      # Go: builds the Landlock launcher the node harness spawns workers under.
      # Its e2e refuses to run unconfined, so without this CI would skip the
      # only test that proves the Node isolation story — and in CI a skip is a
      # failure by design (see node-harness/test/run.mjs).
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: impl/node-harness/launcher/go.sum

      - run: npm ci

      - run: npm run build:launcher --workspace @anon-rpc/node-harness

      - run: npm run typecheck

      # Chromium first: both the site smoke test (inside `npm test`) and the
      # harness e2e drive it.
      - run: npx playwright install --with-deps chromium

      # Workspace tests: browser-harness unit suite (node --test), the
      # specifier suite (dotenv + github-resolver + forge + anvil publish),
      # and the site smoke test (built demo bundle driven against anvil).
      - run: npm test

      # Browser e2e: builds all workspaces, boots the in-process kps echo
      # peer (@kpstreams/server), and drives headless Chromium — including
      # real WebRTC to 127.0.0.1 and IndexedDB persistence across reloads.
      - run: npm run test:e2e
