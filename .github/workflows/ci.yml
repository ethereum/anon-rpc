name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: impl/package-lock.json

      # Foundry: forge/anvil for the specifier subproject (contract tests and
      # the publish-script e2e against a local anvil chain).
      - uses: foundry-rs/foundry-toolchain@v1

      # Go: builds the Landlock launcher. The node harness no longer isolates
      # workers with it — that is the QuickJS isolate's job now, and its e2e
      # needs no toolchain and no particular OS — so this step only keeps the
      # superseded kernel path compiling. Drop it if that path is deleted.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: impl/node-harness/launcher/go.sum

      - run: npm ci

      - run: npm run build:launcher --workspace @anon-rpc/node-harness

      - run: npm run typecheck

      # Chromium first: the site smoke test, the harness e2e and the browser-
      # extension e2e all drive it. That last one needs the FULL chromium build
      # rather than playwright's default chromium-headless-shell, which has no
      # extension support — installing "chromium" brings both.
      - run: npx playwright install --with-deps chromium

      # Workspace tests: browser-harness unit suite (node --test), the
      # browser-extension e2e and the demo-extension test (both load a real
      # unpacked MV3 extension into Chromium), the node-harness e2e (a QuickJS
      # isolate on a worker thread), the specifier suite (dotenv +
      # github-resolver + forge + anvil publish), and the site smoke test
      # (built demo bundle driven against anvil).
      - run: npm test

      # Browser e2e: builds all workspaces, boots the in-process kps echo
      # peer (@kpstreams/server), and drives headless Chromium — including
      # real WebRTC to 127.0.0.1 and IndexedDB persistence across reloads.
      - run: npm run test:e2e
